  <style>
    /* ============================================
       CSS VARIABLES — ALFIERE
       ============================================ */
    :root {
      --arch-color:      #FF4500;
      --arch-color-dim:  rgba(255,69,0,0.2);
      --arch-color-glow: rgba(255,69,0,0.4);

      font-family: 'Montserrat', sans-serif;

      color: var(--text-1);
      min-height: 100vh;
      overflow-x: hidden;
    }

    a { text-decoration: none; color: inherit; }

    .container {
      max-width: 680px;

      padding: 0 20px;

       PAGE CONTENT
       ============================================ */

      opacity: 0;
      pointer-events: none;

    @media (max-width: 768px) {
      body.loading-active #page-content {
        opacity: 0;
        transition: opacity 0.4s ease;

      body.loading-active .section-sub {
        opacity: 1;
        pointer-events: auto;
      }
      #loading-canvas-wrapper {

      }
      #loading-canvas {
        opacity: 1 !important;

    /* ============================================
       PARTICLES (generati via JS)
       ============================================ */
    .particle {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes particleFloat {
      0%, 100% { transform: translateY(0);    opacity: var(--p-opacity); }
      50%       { transform: translateY(-30px); opacity: calc(var(--p-opacity) * 0.5); }

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- =============================================
       LOADING SEQUENCE — Three.js particles
       ============================================= -->
  <script>
  (function () {
    var LC = 2000; // loading particle count
    var PS = 3.5;  // PROF_SCALE per il loading

    var ALFIERE = [
      [0.7,0],[0.55,0.05],[0.32,0.12],[0.24,0.22],[0.26,0.4],
      [0.28,0.55],[0.26,0.65],[0.32,0.72],[0.36,0.8],[0.28,0.86],
      [0.2,0.92],[0.16,1.0],[0.18,1.08],[0.22,1.15],[0.18,1.22],
      [0.1,1.28],[0.05,1.35],[0.08,1.42],[0.04,1.48],[0,1.52]
    ];

    var lRenderer, lScene, lCamera, lGeo, lMat, lPoints, lGroup;
    var lPos, lSizes, lColors, lVelocities;
    var lAnimId  = null;
    var lPhase   = 'chaos';
    var lFallback = null;

    /* ------ profile helpers ------ */
    function profMaxY(p) {
      var m = 0;
      for (var i = 0; i < p.length; i++) if (p[i][1] > m) m = p[i][1];
      return m;
    }
    function profRadius(p, y) {
      for (var i = 1; i < p.length; i++) {
        if (y <= p[i][1]) {
          var t = (y - p[i-1][1]) / (p[i][1] - p[i-1][1]);
          return p[i-1][0] + t * (p[i][0] - p[i-1][0]);
        }
      }
      return 0;
    }

    /* ------ build convergence targets ------ */
    function buildTargets() {
      var maxY = profMaxY(ALFIERE);
      var t = new Float32Array(LC * 3);
      for (var i = 0; i < LC; i++) {
        var yn  = Math.random() * maxY;
        var r   = profRadius(ALFIERE, yn) * Math.pow(Math.random(), 0.3) * PS;
        var ang = Math.random() * Math.PI * 2;
        var i3  = i * 3;
        t[i3]   = Math.cos(ang) * r;
        t[i3+1] = (yn / maxY) * PS - PS * 0.5;
        t[i3+2] = Math.sin(ang) * r;
      }
      return t;
    }

    /* ------ init Three.js scene ------ */
    function init() {
      var canvas = document.getElementById('loading-canvas');
      if (!canvas || typeof THREE === 'undefined') { showPage(); return; }

      lRenderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: false, alpha: true });
      lRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
      lRenderer.setSize(window.innerWidth, window.innerHeight);

      lScene  = new THREE.Scene();
      lCamera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
      lCamera.position.set(0, 0, 10);
      lCamera.lookAt(0, 0, 0);

      lPos      = new Float32Array(LC * 3);
      lSizes    = new Float32Array(LC);
      lColors   = new Float32Array(LC * 3);
      lVelocities = [];

      var bR = 1.0, bG = 0.271, bB = 0.0; // #FF4500
      for (var i = 0; i < LC; i++) {
        var i3 = i * 3;
        lPos[i3]   = (Math.random() - 0.5) * 14;
        lPos[i3+1] = (Math.random() - 0.5) * 10;
        lPos[i3+2] = (Math.random() - 0.5) *  4;

        var vx = (Math.random() - 0.5);
        var vy = (Math.random() - 0.5);
        var vz = (Math.random() - 0.5) * 0.3;
        var mag = Math.sqrt(vx*vx + vy*vy + vz*vz) || 1;
        var spd = 0.15 + Math.random() * 0.35;
        lVelocities.push({ x: (vx/mag)*spd, y: (vy/mag)*spd, z: (vz/mag)*spd });

        var bv = 0.8 + Math.random() * 0.4;
        lColors[i3]   = Math.min(1, bR * bv);
        lColors[i3+1] = Math.min(1, bG * bv);
        lColors[i3+2] = Math.min(1, bB * bv);

        lSizes[i] = 0.015 + Math.random() * 0.020;
      }

      lGeo = new THREE.BufferGeometry();
      lGeo.setAttribute('position', new THREE.BufferAttribute(lPos,    3));
      lGeo.setAttribute('aSize',    new THREE.BufferAttribute(lSizes,  1));
      lGeo.setAttribute('aColor',   new THREE.BufferAttribute(lColors, 3));

      lMat = new THREE.ShaderMaterial({
        vertexShader: [
          'attribute float aSize;',
          'attribute vec3 aColor;',
          'varying vec3 vColor;',
          'void main() {',
          '  vColor = aColor;',
          '  vec4 mv = modelViewMatrix * vec4(position, 1.0);',
          '  gl_PointSize = aSize * (900.0 / -mv.z);',
          '  gl_Position = projectionMatrix * mv;',
          '}'
        ].join('\n'),
        fragmentShader: [
          'varying vec3 vColor;',
          'void main() {',
          '  vec2 uv = gl_PointCoord - 0.5;',
          '  if (length(uv) > 0.5) discard;',
          '  float alpha = smoothstep(0.5, 0.1, length(uv));',
          '  gl_FragColor = vec4(vColor, alpha * 0.9);',
          '}'
        ].join('\n'),
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
      });

      lGroup  = new THREE.Group();
      lPoints = new THREE.Points(lGeo, lMat);
      lGroup.add(lPoints);
      lScene.add(lGroup);

      window.addEventListener('resize', function () {
        if (!lCamera || !lRenderer) return;
        lCamera.aspect = window.innerWidth / window.innerHeight;
        lCamera.updateProjectionMatrix();
        lRenderer.setSize(window.innerWidth, window.innerHeight);
      });

      renderLoop();
      listenAuth();
    }

    /* ------ render loop ------ */
    function renderLoop() {
      if (lPhase === 'done') return;
      lAnimId = requestAnimationFrame(renderLoop);
      if (lGroup) lGroup.rotation.y += 0.005;
      if (lPhase === 'chaos') {
        for (var i = 0; i < LC; i++) {
          var i3 = i * 3, v = lVelocities[i];
          lPos[i3]   += v.x * 0.012;
          lPos[i3+1] += v.y * 0.012;
          lPos[i3+2] += v.z * 0.012;
          if (lPos[i3]   >  8) lPos[i3]   = -8;
          if (lPos[i3]   < -8) lPos[i3]   =  8;
          if (lPos[i3+1] >  6) lPos[i3+1] = -6;
          if (lPos[i3+1] < -6) lPos[i3+1] =  6;
        }
        lGeo.attributes.position.needsUpdate = true;
      }
      lRenderer.render(lScene, lCamera);
    }

    /* ------ listen for auth-result event ------ */
    function listenAuth() {
      /* fallback: if no event after 8s, just show the page */
      lFallback = setTimeout(function () {
        if (lPhase !== 'chaos') return;
        doFadeAndShow(null);
      }, 8000);

      window.addEventListener('auth-result', function (e) {
        clearTimeout(lFallback);
        var valid       = e.detail.valid;
        var redirectUrl = e.detail.redirectUrl;
        var noToken     = e.detail.noToken;

        if (noToken) {
          /* no token: skip 3D animation, immediate fade */
          doFadeAndShow(null);
          return;
        }

        lPhase = 'converge';
        converge(function () {
          setTimeout(function () {
            if (valid) {
              explodeExit();
            } else {
              implodeExit(redirectUrl);
            }
          }, 300);
        });
      }, { once: true });
    }

    /* ------ convergence tween ------ */
    function converge(onDone) {
      var targets  = buildTargets();
      var startPos = new Float32Array(lPos);
      var p = { t: 0 };
      gsap.to(p, {
        t: 1, duration: 0.8, ease: 'power2.inOut',
        onUpdate: function () {
          for (var i = 0; i < LC; i++) {
            var i3 = i * 3;
            lPos[i3]   = startPos[i3]   + (targets[i3]   - startPos[i3])   * p.t;
            lPos[i3+1] = startPos[i3+1] + (targets[i3+1] - startPos[i3+1]) * p.t;
            lPos[i3+2] = startPos[i3+2] + (targets[i3+2] - startPos[i3+2]) * p.t;
          }
          lGeo.attributes.position.needsUpdate = true;
        },
        onComplete: function () {
          for (var j = 0; j < targets.length; j++) lPos[j] = targets[j];
          lGeo.attributes.position.needsUpdate = true;
          if (onDone) onDone();
        }
      });
    }

    /* ------ valid exit: explode outward ------ */
    function explodeExit() {
      var start = new Float32Array(lPos);
      var p = { t: 0 };
      /* Start canvas fade simultaneously */
      fadeCanvasOut(500);
      gsap.to(p, {
        t: 1, duration: 0.6, ease: 'power2.in',
        onUpdate: function () {
          var scale = 1 + p.t * 2;
          for (var i = 0; i < LC; i++) {
            var i3 = i * 3;
            lPos[i3]   = start[i3]   * scale;
            lPos[i3+1] = start[i3+1] * scale;
            lPos[i3+2] = start[i3+2] * scale;
          }
          lGeo.attributes.position.needsUpdate = true;
        },
        onComplete: function () {
          destroyLoader();
          showPage();
        }
      });
    }

    /* ------ invalid exit: implode inward ------ */
    function implodeExit(redirectUrl) {
      var start = new Float32Array(lPos);
      var p = { t: 0 };
      fadeCanvasOut(400);
      gsap.to(p, {
        t: 1, duration: 0.5, ease: 'power2.in',
        onUpdate: function () {
          for (var i = 0; i < LC; i++) {
            var i3 = i * 3;
            lPos[i3]   = start[i3]   * (1 - p.t);
            lPos[i3+1] = start[i3+1] * (1 - p.t);
            lPos[i3+2] = start[i3+2] * (1 - p.t);
          }
          lGeo.attributes.position.needsUpdate = true;
        },
        onComplete: function () {
          destroyLoader();
          if (redirectUrl) {
            window.location.href = redirectUrl;
          } else {
            showPage();
          }
        }
      });
    }

    /* ------ canvas opacity fade (CSS, non-blocking) ------ */
    function fadeCanvasOut(ms) {
      var w = document.getElementById('loading-canvas-wrapper');
      if (!w) return;
      w.style.transition = 'opacity ' + (ms / 1000).toFixed(2) + 's ease';
      w.style.opacity = '0';
    }

    /* ------ fade page in + remove wrapper ------ */
    function doFadeAndShow(redirectUrl) {
      fadeCanvasOut(300);
      setTimeout(function () {
        destroyLoader();
        if (redirectUrl) {
          window.location.href = redirectUrl;
        } else {
          showPage();
        }
      }, 350);
    }

    /* ------ dispose WebGL resources ------ */
    function destroyLoader() {
      lPhase = 'done';
      cancelAnimationFrame(lAnimId);
      var w = document.getElementById('loading-canvas-wrapper');
      if (w) w.remove();
      if (lGeo)      { lGeo.dispose();      lGeo = null; }
      if (lMat)      { lMat.dispose();      lMat = null; }
      if (lRenderer) { lRenderer.dispose(); lRenderer = null; }
      lScene = lCamera = lPoints = lGroup = null;
      lPos = lSizes = lColors = null;
      lVelocities = [];
    }

    /* ------ fade in page content ------ */
    function showPage() {
      document.body.classList.remove('loading-active');
      var pc = document.getElementById('page-content');
      if (pc) pc.style.opacity = '1';
    }

    /* start on DOMContentLoaded */
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  }());
  </script>

      var dur = (8  + Math.random() * 8).toFixed(1);
      var del = (Math.random() * 8).toFixed(1);
      var lft = (Math.random() * 100).toFixed(1);
      var top = (Math.random() * 100).toFixed(1);
      el.style.cssText = [
        'width:'        + sz  + 'px',
        'height:'       + sz  + 'px',
        'left:'         + lft + 'vw',
        'top:'          + top + 'vh',
        '--p-opacity:'  + op,
        'background:rgba(255,69,0,' + op + ')',
        'box-shadow:0 0 6px rgba(255,69,0,' + op + ')',

      ].join(';');

  }());

  <!-- =============================================
       AUTENTICAZIONE + LOGICA PAGINA
       ============================================= -->
  <script>
  /* -------------------- CONFIG -------------------- */
  const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbweYcCMsWIaHb6TpZzY4-Tk5NcwzM4WNAZBsEKd92mxY6inWuq9h1Bm3r3szdEqL9nthg/exec';
  const ERROR_PAGE  = 'https://antoca84.github.io/chess-whispers-arcane/accesso-negato.html';
  const ARCHETIPO   = 'alfiere';

  /* -------------------- UTILITY UI -------------------- */
  function addBanner(type, msg) {
    const b = document.createElement('div');
    b.className = 'access-notice ' + type;
    b.textContent = msg;
    document.body.prepend(b);
    document.body.style.paddingTop = '48px';
  }

  function showQuizCTA() {
    document.getElementById('public-cta-container').innerHTML =
      '<div class="quiz-cta">' +
        '<div class="quiz-cta-inner">' +
          '<h3>Accedi ai Messaggi Completi</h3>' +
          '<p>Completa il quiz gratuito per scoprire il tuo archetipo e sbloccare i messaggi quotidiani personalizzati.</p>' +
          '<a href="../../index.html">Inizia il Quiz Gratuito</a>' +
        '</div>' +
      '</div>';
  }

  function showPrivateSections() {
    document.querySelectorAll('.private-content').forEach(function (el) { el.style.display = 'block'; });
    document.getElementById('share-button').disabled = false;
    document.getElementById('save-button').disabled  = false;
  }

  function hidePrivateSections() {
    document.querySelectorAll('.private-content').forEach(function (el) { el.style.display = 'none'; });
  }

  /* -------------------- TOKEN FLOW -------------------- */
  async function verifyToken(token) {
    try {
      const r = await fetch(WEB_APP_URL + '?action=verify&token=' + encodeURIComponent(token) + '&archetipo=' + ARCHETIPO);
      if (!r.ok) return { valid: false };
      return await r.json();
    } catch (e) {
      console.error(e); return { valid: false };
    }
  }

  async function handleAuth() {
    document.getElementById('current-date').textContent =
      new Date().toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

    const params = new URLSearchParams(window.location.search);
    const token  = params.get('token');

    if (!token) {
      /* Dispatch BEFORE banner/CTA so loading can fade immediately */
      window.dispatchEvent(new CustomEvent('auth-result', { detail: { valid: false, noToken: true } }));
      addBanner('public', 'Contenuto Limitato – nessun token presente');
      hidePrivateSections();
      showQuizCTA();
      return;
    }

    const res = await verifyToken(token);

    if (res && res.valid) {
      /* Set up page content first (hidden behind loading canvas) */
      addBanner('private', 'Accesso Autorizzato — Alfiere');
      showPrivateSections();
      loadDailyMessage();
      enableActions();
      /* Then trigger loading exit animation */
      window.dispatchEvent(new CustomEvent('auth-result', { detail: { valid: true } }));
    } else {
      const redirectUrl = ERROR_PAGE + '?error=' + encodeURIComponent((res && res.error) || 'Token non valido');
      /* Let loading sequence handle redirect after implode animation */
      window.dispatchEvent(new CustomEvent('auth-result', { detail: { valid: false, redirectUrl: redirectUrl } }));
    }
  }

  /* -------------------- MESSAGGI -------------------- */
  async function loadDailyMessage() {
    try {
      const r    = await fetch('../../messages/alfiere-messages.json');
      const data = await r.json();
      const today = new Date().toISOString().split('T')[0];
      const msg   = data[today] || 'Messaggio non disponibile per oggi.';
      document.getElementById('daily-message').textContent = msg;
      window._currentMsg = msg;
    } catch (e) {
      document.getElementById('daily-message').textContent = 'Errore nel caricamento del messaggio.';
    }
  }

  /* -------------------- AZIONI SHARE / SAVE -------------------- */
  function enableActions() {
    const shareBtn = document.getElementById('share-button');
    const saveBtn  = document.getElementById('save-button');

    shareBtn.onclick = async function () {
      const text = window._currentMsg + '\n\nScacchi Mentali';
      if (navigator.share) {
        try { await navigator.share({ title: 'Messaggio dell\'Alfiere', text: text, url: location.href }); } catch (e) {}
      } else {
        try { await navigator.clipboard.writeText(text); alert('Messaggio copiato negli appunti!'); } catch (e) {}
      }
    };

    saveBtn.onclick = function () {
      const blob = new Blob([window._currentMsg], { type: 'text/plain' });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href = url;
      a.download = 'messaggio-alfiere-' + new Date().toISOString().split('T')[0] + '.txt';
      document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
    };
  }

  document.addEventListener('DOMContentLoaded', handleAuth);
  </script>
</body>
</html>
